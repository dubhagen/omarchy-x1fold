# Omarchy 4 is busybox udev+encrypt (not systemd/sd-encrypt).
# bluetoothkbd immediately before encrypt (type the passphrase),
# bluetoothkbd-stop immediately after (BlueZ must not outlive unlock).
# Expected HOOKS:
#   ... block bluetoothkbd encrypt bluetoothkbd-stop filesystems fsck
#   btrfs-overlayfs resume
_x1fold_hooks=()
_x1fold_have_bt=0
for _x1fold_hook in "${HOOKS[@]}"; do
	[[ $_x1fold_hook == bluetoothkbd ]] && _x1fold_have_bt=1
done
if ((_x1fold_have_bt == 0)); then
	for _x1fold_hook in "${HOOKS[@]}"; do
		if [[ $_x1fold_hook == encrypt || $_x1fold_hook == sd-encrypt ]]; then
			_x1fold_hooks+=(bluetoothkbd)
			_x1fold_hooks+=("$_x1fold_hook")
			_x1fold_hooks+=(bluetoothkbd-stop)
		else
			_x1fold_hooks+=("$_x1fold_hook")
		fi
	done
	HOOKS=("${_x1fold_hooks[@]}")
fi
unset _x1fold_hooks _x1fold_have_bt _x1fold_hook

# Early-load the Bluetooth stack so the keyboard can appear before encrypt.
# The matching install hook MUST also ship intel/ibt-0040-0041 firmware;
# without it, hci0 dies in the initramfs and stays dead after switch-root.
# uhid + cmac are required for this folio's BLE HOGP keyboard.
MODULES+=(bluetooth btusb btintel hidp rfcomm bnep uhid cmac)
